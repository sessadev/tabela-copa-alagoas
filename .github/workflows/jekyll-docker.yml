                <td class="col-stats">0</td>
            </tr>
            <tr class="elite">
                <td class="col-pos">2º</td>
                <td><img src="img/Logos das Equipes/FORSAKEN FSK.png" class="escudo"></td>
                <td class="col-nome"><span class="nome-time">FORSAKEN FSK</span></td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
            </tr>
            <tr class="repescagem">
                <td class="col-pos">3º</td>
                <td><img src="img/Logos das Equipes/OS SEM MIRA.png" class="escudo"></td>
                <td class="col-nome"><span class="nome-time">OS SEM MIRA</span></td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
            </tr>
            <tr class="repescagem">
                <td class="col-pos">4º</td>
                <td><img src="img/Logos das Equipes/SEM SENSI.png" class="escudo"></td>
                <td class="col-nome"><span class="nome-time">SEM SENSI</span></td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
            </tr>
            <tr class="repescagem">
                <td class="col-pos">5º</td>
                <td><img src="img/Logos das Equipes/OS MAGNATAS.png" class="escudo"></td>
                <td class="col-nome"><span class="nome-time">OS MAGNATAS</span></td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
            </tr>
            <tr class="repescagem">
                <td class="col-pos">6º</td>
                <td><img src="img/Logos das Equipes/AST CORINGA.png" class="escudo"></td>
                <td class="col-nome"><span class="nome-time">AST CORINGA</span></td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
            </tr>
            <tr class="eliminacao">
                <td class="col-pos">7º</td>
                <td><img src="img/Logos das Equipes/AMOSTRANDINHO DO BDJ.png" class="escudo"></td>
                <td class="col-nome"><span class="nome-time">AMOSTRANDINHO DO BDJ</span></td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
            </tr>
            <tr class="eliminacao">
                <td class="col-pos">8º</td>
                <td><img src="img/Logos das Equipes/W1M E-SPORTS.png" class="escudo"></td>
                <td class="col-nome"><span class="nome-time">W1M E-SPORTS</span></td>
                <td class="col-stats" style="color:var(--dourado); font-weight:800;">0</td>
                <td class="col-stats">0</td>
