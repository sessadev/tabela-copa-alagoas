                <td class="col-stats">0</td>
            </tr>
        </tbody>
    </table>

    <div class="legenda">
        <div class="legenda-item">
            <div class="status-dot" style="background:#00ff00;"></div>
            <span><b style="color: #00ff00;">SEMIFINAL:</b> Os 2 melhores times garantem vaga direta para a semifinal, e recebem uma premiação de 5 reais!.</span>
        </div>
        <div class="legenda-item">
            <div class="status-dot" style="background:#ffa500;"></div>
            <span><b style="color: #ffa500;">FASE DE QUALIFICATÓRIAS:</b> Do 3º ao 6º Lugar, as equipes se enfrentaram em uma rodada no Contra Squad para definir os últimos classificados para a SemiFinal, e receberão uma premiação de 2 reais!.</span>
        </div>
        <div class="legenda-item">
            <div class="status-dot" style="background:#ff0000;"></div>
            <span><b style="color: #ff0000;">ELIMINAÇÃO:</b> Equipes que terminarem nas duas últimas posições ficará de fora das Qualificatórias, e receberão uma premiação de 1 reais!.</span>
        </div>
    </div>

</body>

</html>
